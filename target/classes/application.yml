server:
  address: 0.0.0.0
  port: 8081

spring:
  application:
    name: mini-ruoyi-login
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:mini_ruoyi;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  sql:
    init:
      mode: always
      encoding: UTF-8

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.pengzhipeng.miniruoyi.mapper: debug
