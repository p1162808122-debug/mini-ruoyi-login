services:
  mysql:
    image: mysql:8.4
    container_name: mini-ruoyi-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: mini_ruoyi
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mini_ruoyi_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mini_ruoyi_mysql_data:
